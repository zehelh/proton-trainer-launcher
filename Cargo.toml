[workspace]
resolver = "2"
members = [
    "crates/pt-core",
    "crates/pt-discover",
    "crates/pt-gui",
    "crates/pt-session",
    "crates/pt-trainers",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV policy: current stable minus two minor versions.
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/zehelh/proton-trainer-launcher"
homepage = "https://github.com/zehelh/proton-trainer-launcher"
readme = "README.md"

[workspace.lints.rust]
warnings = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
libc = "0.2"
proptest = "1"
tauri = "2"
tauri-build = "2"
tempfile = "3"

pt-core = { path = "crates/pt-core", version = "0.1.0" }
pt-discover = { path = "crates/pt-discover", version = "0.1.0" }
pt-session = { path = "crates/pt-session", version = "0.1.0" }
pt-trainers = { path = "crates/pt-trainers", version = "0.1.0" }

[profile.release]
lto = "thin"
strip = "symbols"
