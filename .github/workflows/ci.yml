name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  ubuntu:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - name: Test
        run: cargo test --all-features --workspace

  appimage:
    name: AppImage build + smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --workspace
      - name: Build AppImage
        run: packaging/appimage/build.sh 0.0.0-dev
      # APPIMAGE_EXTRACT_AND_RUN runs the image without FUSE, which CI
      # runners do not provide.
      - name: Smoke run (--version)
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 \
            ./build/proton-trainer-0.0.0-dev-x86_64.AppImage --version
      - name: Upload AppImage for the Arch job
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/proton-trainer-0.0.0-dev-x86_64.AppImage
          retention-days: 1

  arch:
    name: Arch Linux container
    runs-on: ubuntu-latest
    needs: appimage
    container:
      image: archlinux:base
    steps:
      - name: Install toolchain
        run: pacman -Sy --noconfirm --needed git nodejs rust
      - uses: actions/checkout@v4
      - name: Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - name: Test
        run: cargo test --all-features --workspace
      # Compatibility item: the AppImage (built against ubuntu's glibc)
      # must run on current Arch inside a clean $HOME sandbox.
      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage
          path: appimage-artifacts
      - name: Run the AppImage in a $HOME sandbox
        run: |
          chmod +x appimage-artifacts/*.AppImage
          export HOME="$(mktemp -d)"
          APPIMAGE_EXTRACT_AND_RUN=1 \
            appimage-artifacts/proton-trainer-0.0.0-dev-x86_64.AppImage --version
