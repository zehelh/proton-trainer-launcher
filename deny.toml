# cargo-deny configuration.
#
# `cargo deny check` is part of the release gate; it is not installed
# on every dev machine, so it runs locally/on the release checklist
# rather than in CI.
[licenses]
version = 2
# Everything in the tree must be MIT, Apache-2.0, or
# Apache-2.0-with-exceptions style (unlicense/isc for small ones).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # option-ext (transitive via toml) is MPL-2.0: weak copyleft,
    # fine to link and distribute.
    "MPL-2.0",
]

[advisories]
version = 2
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436) but is a build-time
    # proc-macro pulled in by ratatui 0.29; no vulnerability is known.
    # Revisit when ratatui drops it.
    "RUSTSEC-2024-0436",
]

[bans]
# Duplicated versions are noisy but allowed; deny does not run on every
# PR, so keep this check permissive and review at release time.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
