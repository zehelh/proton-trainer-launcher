# Trainer for the pt-core integration-test dummy target. This is the
# one example shipped with proton-trainer that fully works: it targets
# the pt-dummy-target test binary, which keeps the pattern below and an
# i32 value 1337 right after it on its heap.
schema_version = 1
id = "pt-dummy"
name = "pt-core dummy target"
steam_app_id = 0
exe_names = ["pt-dummy-target"]
version = "0.1.0"
description = "Working example: patches the value in the pt-dummy-target test binary."

[[entry]]
id = "value"
label = "Set value to 99"
# The ASCII bytes of "PTDUMMY-PATTERN-v1".
search = { pattern = "50 54 44 55 4D 4D 59 2D 50 41 54 54 45 52 4E 2D 76 31" }
offset = 18
value = { type = "i32", data = 99 }
freeze = false
